<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal — ROYAL ATTIR</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body class="bg-[#fafafa] text-slate-900 font-sans antialiased selection:bg-black selection:text-white"
    x-data="adminApp()" x-init="fetchProducts()">

    <!-- Header Navigation -->
    <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 sm:h-20 flex items-center justify-between">
            <a href="/" class="group flex flex-col">
                <span class="text-base sm:text-2xl font-serif tracking-widest text-white uppercase font-semibold">ROYAL
                    ATTIR</span>
                <span class="text-[7px] sm:text-[9px] tracking-[0.25em] uppercase text-amber-400 font-sans -mt-1">ADMIN
                    CONTROL PORTAL</span>
            </a>

            <a href="/"
                class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-[11px] sm:text-xs px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-full font-medium transition whitespace-nowrap">
                ← Back to Store
            </a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8">

        <!-- Section Header -->
        <div class="flex items-center justify-between mb-6 border-b border-slate-200 pb-4">
            <div>
                <h1 class="text-lg sm:text-2xl font-serif font-bold text-slate-900">Garment Management</h1>
                <p class="text-[11px] sm:text-xs text-slate-500 mt-0.5">Manage existing pricing, titles, categories, and
                    inventory photos.</p>
            </div>
            <span class="bg-slate-200 text-slate-700 text-xs px-3 py-1 rounded-full font-semibold shrink-0 ml-2"
                x-text="products.length + ' Items'"></span>
        </div>

        <!-- Desktop Inventory List Table (hidden on small mobile screens) -->
        <div class="hidden md:block bg-white rounded-2xl border border-slate-200/80 shadow-xs overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-600">
                    <thead
                        class="bg-slate-50 text-slate-900 font-semibold border-b border-slate-200 uppercase tracking-wider text-[10px]">
                        <tr>
                            <th class="p-4">Item</th>
                            <th class="p-4">Title</th>
                            <th class="p-4">Category</th>
                            <th class="p-4">Price</th>
                            <th class="p-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        <template x-for="product in products" :key="product.id">
                            <tr class="hover:bg-slate-50/50 transition">
                                <td class="p-4">
                                    <img :src="product.image"
                                        class="w-10 h-12 object-cover rounded-md border border-slate-200">
                                </td>
                                <td class="p-4 font-semibold text-slate-900" x-text="product.name"></td>
                                <td class="p-4">
                                    <span
                                        class="bg-slate-100 text-slate-700 font-semibold px-2.5 py-1 rounded-full uppercase text-[9px] tracking-wider"
                                        x-text="product.category"></span>
                                </td>
                                <td class="p-4 font-bold text-slate-900"
                                    x-text="'$' + Number(product.price).toLocaleString()"></td>
                                <td class="p-4 text-right">
                                    <button @click="openEditModal(product)"
                                        class="bg-slate-100 hover:bg-slate-900 hover:text-white text-slate-800 font-semibold px-3 py-1.5 rounded-lg transition">
                                        Edit
                                    </button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Mobile Item Cards (displays on mobile view) -->
        <div class="block md:hidden space-y-3">
            <template x-for="product in products" :key="product.id">
                <div
                    class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <img :src="product.image"
                            class="w-12 h-14 object-cover rounded-lg border border-slate-100 shrink-0">
                        <div>
                            <span
                                class="bg-slate-100 text-slate-700 font-semibold px-2 py-0.5 rounded-full uppercase text-[8px] tracking-wider inline-block mb-1"
                                x-text="product.category"></span>
                            <h4 class="font-semibold text-xs text-slate-900 leading-tight" x-text="product.name"></h4>
                            <p class="font-bold text-xs text-slate-900 mt-1"
                                x-text="'$' + Number(product.price).toLocaleString()"></p>
                        </div>
                    </div>
                    <button @click="openEditModal(product)"
                        class="bg-slate-100 hover:bg-slate-900 hover:text-white text-slate-800 font-semibold text-xs px-3.5 py-2 rounded-lg transition shrink-0 ml-2">
                        Edit
                    </button>
                </div>
            </template>
        </div>
    </main>

    <!-- Edit Garment Modal -->
    <div x-show="editModalOpen"
        class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs" x-cloak>
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative border border-slate-100"
            @click.away="editModalOpen = false">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
                <h3 class="font-serif font-bold text-base text-slate-900">Edit Garment</h3>
                <button @click="editModalOpen = false"
                    class="text-slate-400 hover:text-slate-900 text-xl">&times;</button>
            </div>

            <form @submit.prevent="saveEdit()" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-semibold text-slate-500 uppercase tracking-wider mb-1">Dress
                        Title</label>
                    <input type="text" x-model="editingProduct.name" required
                        class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs focus:ring-1 focus:ring-slate-900 focus:outline-none">
                </div>

                <div>
                    <label
                        class="block text-[10px] font-semibold text-slate-500 uppercase tracking-wider mb-1">Category</label>
                    <input type="text" x-model="editingProduct.category" required
                        class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs focus:ring-1 focus:ring-slate-900 focus:outline-none">
                </div>

                <div>
                    <label class="block text-[10px] font-semibold text-slate-500 uppercase tracking-wider mb-1">Price
                        ($)</label>
                    <input type="number" step="0.01" x-model="editingProduct.price" required
                        class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs focus:ring-1 focus:ring-slate-900 focus:outline-none">
                </div>

                <div>
                    <label
                        class="block text-[10px] font-semibold text-slate-500 uppercase tracking-wider mb-1">Description</label>
                    <textarea x-model="editingProduct.description" rows="3"
                        class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs focus:ring-1 focus:ring-slate-900 focus:outline-none"></textarea>
                </div>

                <div class="pt-2 flex justify-end space-x-2">
                    <button type="button" @click="editModalOpen = false"
                        class="px-4 py-2 text-xs font-semibold text-slate-500 hover:text-slate-900 transition">Cancel</button>
                    <button type="submit"
                        class="bg-slate-900 hover:bg-amber-500 hover:text-slate-900 text-white font-semibold text-xs px-5 py-2 rounded-lg transition">Save
                        Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function adminApp() {
            return {
                products: [],
                editModalOpen: false,
                editingProduct: {},

                async fetchProducts() {
                    const res = await fetch('/api/products');
                    this.products = await res.json();
                },
                openEditModal(product) {
                    this.editingProduct = { ...product };
                    this.editModalOpen = true;
                },
                async saveEdit() {
                    const res = await fetch(`/api/products/${this.editingProduct.id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.editingProduct)
                    });

                    if (res.ok) {
                        this.editModalOpen = false;
                        this.fetchProducts();
                    } else {
                        alert('Failed to update product');
                    }
                }
            }
        }
    </script>
</body>

</html>
